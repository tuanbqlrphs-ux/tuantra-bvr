<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5130">
<title>Tuần tra BVR</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--g:#1f5130;--g2:#2e7d46;--y:#f5d73c;--bg:#f3f5f1;--card:#fff;--tx:#1d2420;--mu:#66736b;--bd:#dfe5dc;--red:#c0392b;--or:#e67e22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121613;--card:#1c221e;--tx:#e8eee9;--mu:#9aa79e;--bd:#2c352f}}
:root[data-theme="dark"]{--bg:#121613;--card:#1c221e;--tx:#e8eee9;--mu:#9aa79e;--bd:#2c352f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:1100;background:var(--g);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header .gps{font-size:12px;background:rgba(255,255,255,.15);padding:3px 8px;border-radius:12px;white-space:nowrap}
main{padding:12px 16px 96px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:1100;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 2px 9px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:21px;line-height:1}
nav button.on{color:var(--g2);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 14px;font:600 15px system-ui;background:var(--g2);color:#fff;cursor:pointer}
.btn.big{width:100%;padding:18px;font-size:18px}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:var(--red)}.btn.or{background:var(--or)}
.btn.sm{padding:8px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--g2)}.stat span{font-size:12px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:20px;padding:7px 11px;font-size:13.5px}
.chip.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.types .chip{border-radius:10px;text-align:center;padding:8px 4px;font-size:12.5px}
.types .chip i{display:block;font-style:normal;font-size:22px}
.list .it{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd);align-items:center}
.list .it:first-child{border-top:0}
.list .it img{width:58px;height:58px;object-fit:cover;border-radius:8px;flex:none}
.list .it .t{flex:1;min-width:0}.list .it .t b{display:block}
.mu{color:var(--mu);font-size:13px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--bd)}
.badge.live{background:#e74c3c;color:#fff;border-color:#e74c3c;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.5}}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer}
.modal{position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px;font-size:17px}
#pv{width:100%;border-radius:10px;display:block;background:#000}
.map{height:300px;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--bd)}
.warn{background:#fff6dc;color:#6b5200;border:1px solid #f0d77b;border-radius:10px;padding:9px 11px;font-size:13px;margin:8px 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .warn{background:#3a3214;color:#f3e3a3;border-color:#6b5a1d}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:1300;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.hide{display:none!important}
.lyr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.lyr:first-child{border-top:0}
.lyr input[type=checkbox]{width:22px;height:22px;flex:none}
.lyr input[type=color]{width:34px;height:30px;padding:0;border:0;flex:none;background:none}
.lyr .t{flex:1;min-width:0}.lyr .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.where{background:var(--g);color:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.where b{color:var(--y)}
.fullmap{height:calc(100vh - 250px);min-height:320px}
.leaflet-popup-content table td{padding:1px 4px;font-size:12px;border-bottom:1px solid #eee}
table{border-collapse:collapse;width:100%}
#print{display:none}
@media print{
 body>*:not(#print){display:none!important}
 #print{display:block;color:#000;background:#fff;font:13pt "Times New Roman",serif}
 #print table td,#print table th{border:1px solid #000;padding:4px 6px;font-size:11.5pt;vertical-align:top}
 #print .ph{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 #print .ph img{width:100%;page-break-inside:avoid}
 @page{margin:15mm}
}
</style>
</head>
<body>
<header><img src="logo.png" alt="" style="height:30px" onerror="this.remove()"><h1>Tuần tra BVR</h1><span class="gps" id="gpsBadge">GPS: chờ…</span></header>
<main>
 <!-- TAB TUẦN TRA -->
 <section id="tab-patrol"></section>
 <!-- TAB ẢNH -->
 <section id="tab-photos" class="hide"></section>
 <!-- TAB NHẬT KÝ -->
 <section id="tab-log" class="hide"></section>
 <!-- TAB BẢN ĐỒ -->

 <!-- TAB CÀI ĐẶT -->
 <section id="tab-set" class="hide"></section>
</main>
<nav>
 <button data-t="patrol" class="on"><b>🧭</b>Tuần tra</button>
 <button data-t="cam" id="navCam"><b>📷</b>Chụp ảnh</button>
 <button data-t="map"><b>🗺️</b>Bản đồ</button>
 <button data-t="photos"><b>🖼️</b>Ảnh</button>

<input type="file" id="camIn" accept="image/*" capture="environment" class="hide">
<input type="file" id="galIn" accept="image/*" class="hide">
<input type="file" id="impIn" accept=".json,application/json" multiple class="hide">
<input type="file" id="logoIn" accept="image/*" class="hide">
<input type="file" id="mapIn" multiple class="hide">

<!-- Modal ghi nhận -->
<div class="modal" id="obsModal"><div class="sheet">
 <h3 id="obsTitle">Ghi nhận</h3>
 <div id="pvWrap"><canvas id="pv"></canvas>
  <div class="row" style="margin-top:6px"><button class="btn sec sm" id="addMore">📷 Chụp thêm ảnh</button></div>
  <div class="mu" id="pvInfo"></div>
 </div>
 <label>Loại ghi nhận</label><div class="types" id="typeBox"></div>
 <label>Mô tả nội dung (in lên ảnh)</label><textarea id="oNote" placeholder="VD: Phát hiện 3 cây keo bị chặt, đường kính 15–20cm"></textarea>
 <div class="row">
  <div><label>Mức độ</label><select id="oLevel"><option>Bình thường</option><option>Cần theo dõi</option><option>Nghiêm trọng</option></select></div>
  <div><label>Số lượng / diện tích</label><input id="oQty" placeholder="VD: 0,2 ha; 3 cây"></div>
 </div>
 <label>Địa danh (tiểu khu, khoảnh, lô, thôn)</label><input id="oPlace" placeholder="VD: TK 615, K3, lô b – thôn Bến Sung 1">
 <label>Xử lý</label><div class="chips" id="actBox"></div>
 <div class="row" style="margin-top:14px"><button class="btn sec" id="obsCancel">Hủy</button><button class="btn" id="obsSave">💾 Lưu ghi nhận</button></div>
</div></div>

<!-- Modal xem ảnh -->
<div class="modal" id="imgModal"><div class="sheet">
 <img id="bigImg" style="width:100%;border-radius:10px">
 <div class="mu" id="bigInfo" style="margin:6px 0"></div>
 <div class="row"><button class="btn" id="bigShare">📤 Gửi (Zalo…)</button><button class="btn sec" id="bigDl">⬇️ Lưu máy</button><button class="btn sec" id="bigClose">Đóng</button></div>
</div></div>

<div class="toast" id="toast"></div>
<div id="print"></div>

<script>
'use strict';
/* ========== DANH MỤC ========== */
const TRAM=['Trạm QLBVR Thanh Vinh','Trạm QLBVR Ấp Cũ','Trạm QLBVR Làng Mó','Trạm QLBVR Xuân Du','Trạm QLBVR Thượng Ninh','Trạm QLBVR Khe Tre','Phòng HC, BV&PTR'];
const TYPES=[
 ['tt','🚶','Tuần tra bình thường'],['chay','🔥','Cháy rừng / nguy cơ cháy'],['go','🪓','Khai thác gỗ trái phép'],
 ['lan','🌱','Phát, lấn chiếm rừng'],['san','🪤','Săn bắt, đặt bẫy'],['dv','🦌','Động vật hoang dã'],
 ['sau','🐛','Sâu bệnh hại rừng'],['moc','📍','Mốc ranh giới, biển báo'],['tuyen','📢','Tuyên truyền'],
 ['vc','🚚','Vận chuyển lâm sản'],['thien','🌊','Thiên tai, mưa lũ'],['khac','📝','Khác']];
const ACTS=['Không cần xử lý','Nhắc nhở tại chỗ','Lập biên bản','Báo cáo Trạm/Ban','Phối hợp Kiểm lâm','Báo chính quyền xã'];
const VEH=['Đi bộ','Xe máy','Ô tô','Thuyền'];
const typeOf=k=>TYPES.find(t=>t[0]===k)||TYPES[TYPES.length-1];
const APP_VER='1.2 (09/11/2026)';
const CREDIT_HTML='<div class="mu" style="margin-top:8px;font-size:12.5px">Thiết kế và Phát triển: <b>Nguyễn Văn Tuấn</b> – PTP. HC-BV&amp;PTR<br>BQL rừng phòng hộ Như Thanh</div>';

/* ========== CÀI ĐẶT ========== */
const SKEY='tuantra_bvr_settings_v1';
const DEF={name:'',role:'',unit:TRAM[0],title:'Tuần tra BVR',sub:'',members:'',logo:'',cm:105,minDist:8,maxAcc:50,autoSave:true,maxDim:1920,quality:0.85,geocode:true,theme:''};
let S={...DEF};
try{S={...DEF,...JSON.parse(localStorage.getItem(SKEY)||'{}')}}catch(e){}
// mã máy (để ghi nhận ngoài chuyến của các máy khác nhau không trùng khi Trạm/Ban gộp dữ liệu)
const devId=()=>{if(!S.dev){S.dev=Math.random().toString(36).slice(2,8);saveS()}return S.dev};
const saveS=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){toast('Không lưu được cài đặt (bộ nhớ trình duyệt bị chặn)')}};
if(S.theme)document.documentElement.dataset.theme=S.theme;

/* ========== TIỆN ÍCH ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const THU=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const fTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fDate=t=>{const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const fDT=t=>fTime(t)+' '+fDate(t);
const fDur=ms=>{const m=Math.floor(ms/60000);return Math.floor(m/60)+' giờ '+pad(m%60)+' phút'};
const fKm=m=>(m/1000).toFixed(2).replace('.',',')+' km';
const fileStamp=t=>{const d=new Date(t);return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())};
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms)}
function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function dms(v,pos,neg){const s=v<0?neg:pos;v=Math.abs(v);const d=Math.floor(v),m=Math.floor((v-d)*60),sec=((v-d)*60-m)*60;return d+'°'+pad(m)+"'"+sec.toFixed(1).padStart(4,'0')+'"'+s}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}

/* ========== VN-2000 (WGS84 -> VN2000, múi 3°, k0=0.9999) ========== */
const GA=6378137,GF=1/298.257223563,GE2=GF*(2-GF),RAD=Math.PI/180,EP2=GE2/(1-GE2);
// Helmert 7 tham số (TT 973/2001): WGS84 -> VN2000; inv=true: VN2000 -> WGS84
function helm(lat,lon,inv){
 let B=lat*RAD,L=lon*RAD,N=GA/Math.sqrt(1-GE2*Math.sin(B)**2);
 const X=N*Math.cos(B)*Math.cos(L),Y=N*Math.cos(B)*Math.sin(L),Z=N*(1-GE2)*Math.sin(B);
 const g=inv?-1:1,s=RAD/3600;
 const dX=g*-191.90441429,dY=g*-39.30318279,dZ=g*-111.45032835,rx=g*-0.00928836*s,ry=g*0.01975479*s,rz=g*-0.00427372*s,k=1+g*0.252906278e-6;
 const X2=dX+k*(X+rz*Y-ry*Z),Y2=dY+k*(-rz*X+Y+rx*Z),Z2=dZ+k*(ry*X-rx*Y+Z);
 const p=Math.hypot(X2,Y2);L=Math.atan2(Y2,X2);B=Math.atan2(Z2,p*(1-GE2));
 for(let i=0;i<6;i++){N=GA/Math.sqrt(1-GE2*Math.sin(B)**2);const h=p/Math.cos(B)-N;B=Math.atan2(Z2,p*(1-GE2*N/(N+h)))}
 return {lat:B/RAD,lon:L/RAD};
}
function tmFwd(lat,lon,cm,k0){
 const B=lat*RAD,L=lon*RAD,e2=GE2,N=GA/Math.sqrt(1-e2*Math.sin(B)**2),T=Math.tan(B)**2,C=EP2*Math.cos(B)**2,A=(L-cm*RAD)*Math.cos(B);
 const M=GA*((1-e2/4-3*e2*e2/64-5*e2**3/256)*B-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*B)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*B)-(35*e2**3/3072)*Math.sin(6*B));
 return {e:500000+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*EP2)*A**5/120),
  n:k0*(M+N*Math.tan(B)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*EP2)*A**6/720))};
}
function tmInv(n,e,cm,k0){
 const e2=GE2,e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2)),mu=n/k0/(GA*(1-e2/4-3*e2*e2/64-5*e2**3/256));
 const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
 const sn=Math.sin(p1),C1=EP2*Math.cos(p1)**2,T1=Math.tan(p1)**2,N1=GA/Math.sqrt(1-e2*sn*sn),R1=GA*(1-e2)/(1-e2*sn*sn)**1.5,D=(e-500000)/(N1*k0);
 const lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*EP2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*EP2-3*C1*C1)*D**6/720);
 const lon=cm*RAD+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*EP2+24*T1*T1)*D**5/120)/Math.cos(p1);
 return {lat:lat/RAD,lon:lon/RAD};
}
function toVN2000(lat,lon,cm){const h=helm(lat,lon,false),t=tmFwd(h.lat,h.lon,cm,0.9999);return {x:Math.round(t.n),y:Math.round(t.e)}}
function fromVN2000(x,y,cm,k0){const g=tmInv(x,y,cm,k0||0.9999);return helm(g.lat,g.lon,true)}

/* ========== INDEXEDDB ========== */
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{const r=indexedDB.open('tuantra_bvr',2);r.onupgradeneeded=()=>{const d=r.result,has=n=>d.objectStoreNames.contains(n);if(!has('patrols'))d.createObjectStore('patrols',{keyPath:'id'});if(!has('photos')){const p=d.createObjectStore('photos',{keyPath:'id'});p.createIndex('patrol','patrolId')}if(!has('layers'))d.createObjectStore('layers',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode),s=t.objectStore(store);let out;const r=fn(s);if(r&&'onsuccess' in r)r.onsuccess=()=>out=r.result;t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}
const put=(st,v)=>tx(st,'readwrite',s=>s.put(v));
const get=(st,k)=>tx(st,'readonly',s=>s.get(k));
const all=(st)=>tx(st,'readonly',s=>s.getAll());
const del=(st,k)=>tx(st,'readwrite',s=>s.delete(k));
const photosOf=pid=>tx('photos','readonly',s=>s.index('patrol').getAll(pid));

/* ========== GPS ========== */
let fix=null,watchId=null,active=null,dirty=0,lastSave=0,wakeLock=null;
function startGPS(){
 if(!('geolocation' in navigator)){$('#gpsBadge').textContent='Không có GPS';return}
 if(watchId!==null)return;
 watchId=navigator.geolocation.watchPosition(onFix,e=>{$('#gpsBadge').textContent=e.code===1?'GPS bị chặn':'Mất GPS';if(e.code===1)toast('Hãy cho phép quyền Vị trí cho trang này để ghi tọa độ',5000)},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
}
function onFix(p){
 const c=p.coords;fix={lat:c.latitude,lng:c.longitude,acc:Math.round(c.accuracy),alt:c.altitude!=null?Math.round(c.altitude):null,ts:p.timestamp||Date.now()};
 $('#gpsBadge').textContent='GPS ±'+fix.acc+'m';
 if(active&&active.status==='active'){
  const pt=[+fix.lat.toFixed(6),+fix.lng.toFixed(6),fix.ts,fix.acc];
  if(fix.acc<=S.maxAcc){
   const seg=active.track[active.track.length-1];
   const last=seg[seg.length-1];
   if(!last){seg.push(pt);dirty++}
   else{const d=hav(last,pt);if(d>=Math.max(S.minDist,fix.acc*0.5)||(pt[2]-last[2]>120000&&d>3)){if(d<1000||pt[2]-last[2]>60000){active.distance+=d;seg.push(pt);dirty++}}}
  }
  if(dirty&&(Date.now()-lastSave>15000)){lastSave=Date.now();dirty=0;put('patrols',active)}
 }
 if(curTab==='patrol')updLive();
 if(curTab==='map')updMapPos();
}
function freshFix(){return new Promise(res=>{
 if(fix&&Date.now()-fix.ts<15000)return res(fix);
 if(!('geolocation' in navigator))return res(fix);
 navigator.geolocation.getCurrentPosition(p=>{onFix(p);res(fix)},()=>res(fix&&Date.now()-fix.ts<300000?fix:null),{enableHighAccuracy:true,timeout:12000,maximumAge:10000});
})}

const geoCache={};
async function revGeo(lat,lng){
 if(!S.geocode||!navigator.onLine)return '';
 const k=lat.toFixed(3)+','+lng.toFixed(3);if(geoCache[k]!==undefined)return geoCache[k];
 try{const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),4500);
  const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=vi&lat='+lat+'&lon='+lng,{signal:ac.signal});clearTimeout(tm);
  const j=await r.json(),a=j.address||{};
  const parts=[a.road,a.hamlet||a.village||a.neighbourhood||a.quarter,a.suburb||a.town||a.municipality||a.city_district,a.state||a.city].filter(Boolean);
  return geoCache[k]=[...new Set(parts)].join(', ');
 }catch(e){return ''}
}

function wrap(ctx,text,maxW){const out=[];for(const para of String(text||'').split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}if(line)out.push(line)}return out}

 const lw=logo,lh=logoImg?Math.round(logo*Math.min(1,(logoImg.naturalHeight||1)/(logoImg.naturalWidth||1))):0;
 c.font=F(34,1);const t1=wrap(c,m.title,iw-tx0);c.font=F(30,1);const t2=m.sub?wrap(c,m.sub,iw-tx0):[];
 const hh=Math.max(logo,t1.length*42*u+t2.length*38*u);
 ops.push(yy=>{if(logo){c.save();c.shadowBlur=0;c.drawImage(logoImg,ip,yy+(hh-lh)/2,lw,lh);c.restore()}
  let ty=yy+(hh-(t1.length*42*u+t2.length*38*u))/2;c.fillStyle='#f5d73c';c.textBaseline='top';
  c.font=F(34,1);t1.forEach(l=>{c.fillText(l,ip+tx0,ty);ty+=42*u});c.font=F(30,1);t2.forEach(l=>{c.fillText(l,ip+tx0,ty);ty+=38*u})});
 y+=hh+12*u;
 c.font=F(28,1);const tl=wrap(c,m.typeLabel,iw);
 c.font=F(25);const nl=wrap(c,m.note,iw).slice(0,4);
 const y1=y;ops.push(()=>{let yy=y1;c.fillStyle='#fff';c.font=F(28,1);tl.forEach(l=>{c.fillText(l,ip,yy);yy+=36*u});c.font=F(25);nl.forEach(l=>{c.fillText(l,ip,yy);yy+=32*u})});
 y+=tl.length*36*u+nl.length*32*u+8*u;
 const y2=y;ops.push(()=>{c.fillStyle='#f5d73c';c.fillRect(ip,y2,iw,3*u);c.font=F(16,1);let s='';while(c.measureText(s+'>').width<iw)s+='>';c.fillText(s,ip,y2+7*u)});

 y+=96*u;
 const lines=[];

const KY=[['tuan','Tuần'],['thang','Tháng'],['quy','Quý'],['6thang','6 tháng'],['nam','Năm'],['tuy','Tùy chọn']];
let SUM={ky:'thang',off:0,scope:'all',from:'',to:''};
try{Object.assign(SUM,JSON.parse(localStorage.getItem('tuantra_sum')||'{}'),{off:0})}catch(e){}
const durOf=p=>Math.max(0,(p.end||Date.now())-p.start-(p.pausedMs||0)-(p.status==='paused'&&p.pausedAt?Date.now()-p.pausedAt:0));
const hrs=ms=>(ms/3600000).toFixed(1).replace('.',',');
const kmN=m=>(m/1000).toFixed(2).replace('.',',');
const normName=s=>String(s||'').trim().replace(/\s+/g,' ');
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function periodRange(ky,off){
 const n=new Date();let a,b,label;
 if(ky==='tuan'){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate());const wd=(d.getDay()+6)%7;a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd+7*off);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7);
  label=`Tuần ${isoWeek(a)} (${fDate(a).slice(0,5)} – ${fDate(b-1)})`}
 else if(ky==='thang'){a=new Date(n.getFullYear(),n.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,1);label=`Tháng ${a.getMonth()+1}/${a.getFullYear()}`}
 else if(ky==='quy'){const q=Math.floor(n.getMonth()/3)+off;a=new Date(n.getFullYear(),q*3,1);b=new Date(a.getFullYear(),a.getMonth()+3,1);label=`Quý ${['I','II','III','IV'][Math.floor(a.getMonth()/3)]}/${a.getFullYear()}`}
 else if(ky==='6thang'){const h=Math.floor(n.getMonth()/6)+off;a=new Date(n.getFullYear(),h*6,1);b=new Date(a.getFullYear(),a.getMonth()+6,1);label=`6 tháng ${a.getMonth()?'cuối':'đầu'} năm ${a.getFullYear()}`}
 else if(ky==='nam'){a=new Date(n.getFullYear()+off,0,1);b=new Date(a.getFullYear()+1,0,1);label=`Năm ${a.getFullYear()}`}
 else{a=SUM.from?new Date(SUM.from+'T00:00'):new Date(n.getFullYear(),n.getMonth(),1);b=SUM.to?new Date(new Date(SUM.to+'T00:00').getTime()+864e5):new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);label=`Từ ${fDate(a)} đến ${fDate(b-1)}`}
 return {a:+a,b:+b,label};
}
// Gom số liệu. scope: 'all' | 'u:<Trạm>' | 'p:<Họ tên>'
function summarize(ps,r,scope){
 const inR=t=>t>=r.a&&t<r.b;
 const pAll=ps.filter(p=>!p.loose&&p.start>=r.a&&p.start<r.b);
 const obsAll=[];ps.forEach(p=>p.obs.forEach(o=>{if(inR(o.ts))obsAll.push({o,p})}));
 const who=(p)=>[...new Set([p.leader,...(p.members||[])].map(normName).filter(Boolean))];
 let pats=pAll,obs=obsAll;
 if(scope.startsWith('u:')){const u=scope.slice(2);pats=pAll.filter(p=>(p.unit||'')===u);obs=obsAll.filter(x=>(x.p.unit||'')===u)}
 if(scope.startsWith('p:')){const nm=scope.slice(2);pats=pAll.filter(p=>who(p).includes(nm));obs=obsAll.filter(x=>normName(x.o.by||x.p.leader)===nm)}
 const tot={chuyen:pats.length,km:pats.reduce((s,p)=>s+(p.distance||0),0),ms:pats.reduce((s,p)=>s+durOf(p),0),gn:obs.length,vv:obs.filter(x=>x.o.type!=='tt').length,anh:obs.reduce((s,x)=>s+(x.o.photoIds?.length||0),0),
  nguoi:new Set(pats.flatMap(who)).size,ngay:new Set(pats.map(p=>fDate(p.start))).size};
 // theo Trạm
 const U={};const uRow=u=>U[u]=U[u]||{u,chuyen:0,km:0,ms:0,gn:0,vv:0,nguoi:new Set()};
 pats.forEach(p=>{const x=uRow(p.unit||'(chưa rõ)');x.chuyen++;x.km+=p.distance||0;x.ms+=durOf(p);who(p).forEach(n=>x.nguoi.add(n))});
 obs.forEach(({o,p})=>{const x=uRow(p.unit||'(chưa rõ)');x.gn++;if(o.type!=='tt')x.vv++});
 // theo cá nhân (mọi người trong tổ đều được tính chuyến/giờ/km; ghi nhận tính cho người ghi)
 const P={};const pRow=n=>P[n]=P[n]||{n,units:{},chuyen:0,chuTri:0,km:0,ms:0,gn:0,vv:0};
 pats.forEach(p=>who(p).forEach(n=>{const x=pRow(n);x.chuyen++;if(normName(p.leader)===n)x.chuTri++;x.km+=p.distance||0;x.ms+=durOf(p);x.units[p.unit||'']=(x.units[p.unit||'']||0)+1}));
 obs.forEach(({o,p})=>{const n=normName(o.by||p.leader);if(!n)return;const x=pRow(n);x.gn++;if(o.type!=='tt')x.vv++;x.units[p.unit||'']=(x.units[p.unit||'']||0)+(x.chuyen?0:1)});
 const persons=Object.values(P).map(x=>({...x,unit:Object.entries(x.units).sort((a,b)=>b[1]-a[1])[0]?.[0]||''}));
 if(scope.startsWith('p:')){const nm=scope.slice(2);persons.splice(0,persons.length,...persons.filter(x=>x.n===nm))}
 if(scope.startsWith('u:')){const u=scope.slice(2);for(let i=persons.length-1;i>=0;i--)if(persons[i].unit!==u&&!pats.some(p=>p.unit===u&&who(p).includes(persons[i].n)))persons.splice(i,1)}
 // theo loại sự việc
 const T={};obs.forEach(({o})=>T[o.type]=(T[o.type]||0)+1);
 return {tot,units:Object.values(U).sort((a,b)=>TRAM.indexOf(a.u)-TRAM.indexOf(b.u)),persons:persons.sort((a,b)=>(TRAM.indexOf(a.unit)-TRAM.indexOf(b.unit))||b.ms-a.ms),types:TYPES.filter(t=>T[t[0]]).map(t=>({t,n:T[t[0]]})),
  incidents:obs.filter(x=>x.o.type!=='tt').sort((a,b)=>a.o.ts-b.o.ts),pats:pats.sort((a,b)=>a.start-b.start)};
}
const scopeLabel=s=>s==='all'?'Toàn đơn vị (BQL rừng phòng hộ Như Thanh)':s.startsWith('u:')?s.slice(2):'Cá nhân: '+s.slice(2);

let leafletP=null;
function loadLeaflet(){if(window.L)return Promise.resolve(true);if(!navigator.onLine)return Promise.resolve(false);if(leafletP)return leafletP;
 leafletP=new Promise(res=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(l);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=()=>res(true);s.onerror=()=>{leafletP=null;res(false)};document.head.appendChild(s);setTimeout(()=>res(!!window.L),8000)});return leafletP}
async function drawMap(box,p){
 const segs=p.track.filter(s=>s.length),pts=[...segs.flat(),...p.obs.filter(o=>o.lat!=null).map(o=>[o.lat,o.lng])];
 if(!pts.length){box.innerHTML='<div class="mu" style="padding:16px">Chưa có tọa độ để vẽ bản đồ.</div>';return}
 const ok=await loadLeaflet();
 if(ok){
  if(box._map){box._map.remove();box._map=null}box.innerHTML='';
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});

function svgTrack(p,W,H){
 const segs=p.track.filter(s=>s.length),pts=[...segs.flat(),...p.obs.filter(o=>o.lat!=null).map(o=>[o.lat,o.lng])];if(!pts.length)return '';
 let a=Math.min(...pts.map(x=>x[0])),b=Math.max(...pts.map(x=>x[0])),c=Math.min(...pts.map(x=>x[1])),d=Math.max(...pts.map(x=>x[1]));
 const kx=Math.cos((a+b)/2*Math.PI/180),sx=(d-c)*kx||1e-4,sy=(b-a)||1e-4,sc=Math.min((W-30)/sx,(H-30)/sy);
 const X=v=>15+((v-c)*kx)*sc+((W-30)-sx*sc)/2,Y=v=>H-15-(v-a)*sc-((H-30)-sy*sc)/2;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="background:#e9efe6">${segs.map(s=>`<polyline fill="none" stroke="#c0392b" stroke-width="3" points="${s.map(x=>X(x[1]).toFixed(1)+','+Y(x[0]).toFixed(1)).join(' ')}"/>`).join('')}${p.obs.filter(o=>o.lat!=null).map((o,i)=>`<circle cx="${X(o.lng)}" cy="${Y(o.lat)}" r="7" fill="#1f5130"/><text x="${X(o.lng)}" y="${Y(o.lat)+4}" font-size="9" fill="#fff" text-anchor="middle">${i+1}</text>`).join('')}</svg>`;
}

const TCVN3=(()=>{const m={},s='µàu¶ảu·ãu¸áu¹ạu¨ău»ằu¼ẳu½ẵu¾ắuÆặu©âuÇầuÈẩuÉẫuÊấuËậu®đuÌèuÎẻuÏẽuÐéuÑẹuªêuÒềuÓểuÔễuÕếuÖệu×ìuØỉuÜĩuÝíuÞịußòuáỏuâõuãóuäọu«ôuåồuæổuçỗuèốuéộu¬ơuêờuëởuìỡuíớuîợuïùuñủuòũuóúuôụu­ưuõừuöửu÷ữuøứuùựuúỳuûỷuüỹuýýuþỵu¡Ău¢Âu£Êu¤Ôu¥Ơu¦Ưu§Đ'.split('u');s.forEach(p=>{if(p.length===2)m[p.charCodeAt(0)]=p[1]});return m})();
function decodeTxt(bytes,enc){
 if(enc==='utf8'||enc==='auto'){try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch(e){if(enc==='utf8')return new TextDecoder('utf-8').decode(bytes)}}
 if(enc==='win1258')return new TextDecoder('windows-1258').decode(bytes);
 let o='';for(const b of bytes)o+=b<128?String.fromCharCode(b):(TCVN3[b]||String.fromCharCode(b));return o;
}
function guessEnc(u8,cpg){
 if(cpg){const c=cpg.toUpperCase();if(/UTF/.test(c))return 'utf8';if(/1258/.test(c))return 'win1258'}
 let hi=false;for(let i=0;i<u8.length;i++)if(u8[i]>127){hi=true;break}
 if(!hi)return 'utf8';
 try{new TextDecoder('utf-8',{fatal:true}).decode(u8);return 'utf8'}catch(e){}
 return 'tcvn3';
}
// --- Giải nén ZIP/KMZ (không cần thư viện) ---
async function unzip(buf){
 const dv=new DataView(buf),u=new Uint8Array(buf);let e=buf.byteLength-22;
 while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('File zip hỏng');
 const cnt=dv.getUint16(e+10,true);let o=dv.getUint32(e+16,true);const out={};
 for(let i=0;i<cnt;i++){
  const meth=dv.getUint16(o+10,true),csz=dv.getUint32(o+20,true),nl=dv.getUint16(o+28,true),xl=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true),lo=dv.getUint32(o+42,true);
  const name=new TextDecoder().decode(u.subarray(o+46,o+46+nl));
  const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u.subarray(st,st+csz);
  if(!name.endsWith('/')){
   if(meth===0)out[name]=data.slice().buffer;
   else if(meth===8)out[name]=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
  }
  o+=46+nl+xl+cl;
 }
 return out;
}
// --- Hệ tọa độ ---
function crsFromPrj(t){
 if(!t)return null;const u=t.toUpperCase().replace(/\s+/g,'');
 if(!/PROJCS/.test(u))return {type:'wgs'};
 const cm=parseFloat((u.match(/CENTRAL_MERIDIAN",?([-\d.]+)/)||[])[1]),k0=parseFloat((u.match(/SCALE_FACTOR",?([\d.]+)/)||[])[1]);
 const vn=/VN[-_]?2000|VN2000|VIETNAM|HANOI/.test(u);
 return {type:(!vn&&/WGS_?(19)?84/.test(u))?'utm':'vn2000',cm:isNaN(cm)?S.cm:cm,k0:isNaN(k0)?(vn?0.9999:0.9996):k0};
}
function mapOpts(){return {enc:$('#mEnc')?.value||'auto',crs:$('#mCrs')?.value||'auto',cm:+($('#mCm')?.value||S.cm)}}
function pickCrs(prj,sample,o){
 if(o.crs==='wgs')return {type:'wgs'};
 if(o.crs==='vn3')return {type:'vn2000',cm:o.cm,k0:0.9999};
 if(o.crs==='vn6')return {type:'vn2000',cm:o.cm,k0:0.9996};
 if(o.crs==='utm')return {type:'utm',cm:o.cm,k0:0.9996};
 const p=crsFromPrj(prj);if(p)return p;
 if(sample&&Math.abs(sample[0])<=180&&Math.abs(sample[1])<=90)return {type:'wgs'};
 return {type:'vn2000',cm:o.cm,k0:0.9999};
}
function mkTf(c){
 const r=v=>Math.round(v*1e7)/1e7;
 if(c.type==='wgs')return p=>[r(p[0]),r(p[1])];
 if(c.type==='utm')return p=>{const g=tmInv(p[1],p[0],c.cm,c.k0);return [r(g.lon),r(g.lat)]};
 return p=>{const g=fromVN2000(p[1],p[0],c.cm,c.k0);return [r(g.lon),r(g.lat)]};
}
const crsName=c=>c.type==='wgs'?'WGS84 (độ)':c.type==='utm'?'UTM WGS84 KTT '+c.cm+'°':'VN-2000 KTT '+c.cm+'° k0='+c.k0;
function mapGeom(g,f){if(!g)return g;const t=g.type;
 if(t==='Point')return {type:t,coordinates:f(g.coordinates)};
 if(t==='MultiPoint'||t==='LineString')return {type:t,coordinates:g.coordinates.map(f)};
 if(t==='MultiLineString'||t==='Polygon')return {type:t,coordinates:g.coordinates.map(a=>a.map(f))};
 if(t==='MultiPolygon')return {type:t,coordinates:g.coordinates.map(a=>a.map(b=>b.map(f)))};
 if(t==='GeometryCollection')return {type:t,geometries:g.geometries.map(x=>mapGeom(x,f))};return g}
function firstCoord(g){if(!g)return null;if(g.type==='GeometryCollection'){for(const x of g.geometries){const c=firstCoord(x);if(c)return c}return null}let c=g.coordinates;while(Array.isArray(c)&&Array.isArray(c[0]))c=c[0];return Array.isArray(c)&&typeof c[0]==='number'?c:null}
// --- Shapefile ---
function parseShp(buf){
 const dv=new DataView(buf),out=[];let o=100;
 const ringCW=r=>{let s=0;for(let i=0;i<r.length-1;i++)s+=(r[i+1][0]-r[i][0])*(r[i+1][1]+r[i][1]);return s>0};
 const inRing=(pt,r)=>{let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){if(((r[i][1]>pt[1])!==(r[j][1]>pt[1]))&&(pt[0]<(r[j][0]-r[i][0])*(pt[1]-r[i][1])/(r[j][1]-r[i][1])+r[i][0]))c=!c}return c};
 while(o+12<=buf.byteLength){
  const len=dv.getInt32(o+4)*2,ro=o+8,t=dv.getInt32(ro,true);let g=null;
  if(t===1||t===11||t===21)g={type:'Point',coordinates:[dv.getFloat64(ro+4,true),dv.getFloat64(ro+12,true)]};
  else if(t===8||t===18||t===28){const n=dv.getInt32(ro+36,true),c=[];for(let i=0;i<n;i++)c.push([dv.getFloat64(ro+40+i*16,true),dv.getFloat64(ro+48+i*16,true)]);g={type:'MultiPoint',coordinates:c}}
  else if([3,13,23,5,15,25].includes(t)){
   const np=dv.getInt32(ro+36,true),nn=dv.getInt32(ro+40,true),parts=[];for(let i=0;i<np;i++)parts.push(dv.getInt32(ro+44+i*4,true));
   const pb=ro+44+np*4,rings=[];
   for(let i=0;i<np;i++){const a=parts[i],b=i+1<np?parts[i+1]:nn,r=[];for(let k=a;k<b;k++)r.push([dv.getFloat64(pb+k*16,true),dv.getFloat64(pb+k*16+8,true)]);rings.push(r)}
   if(t%10===3)g=rings.length===1?{type:'LineString',coordinates:rings[0]}:{type:'MultiLineString',coordinates:rings};
   else{const polys=[],holes=[];rings.forEach(r=>ringCW(r)||rings.length===1?polys.push([r]):holes.push(r));
    holes.forEach(h=>{const p=polys.find(p=>inRing(h[0],p[0]))||polys[polys.length-1];if(p)p.push(h);else polys.push([h])});
    g=polys.length===1?{type:'Polygon',coordinates:polys[0]}:{type:'MultiPolygon',coordinates:polys}}
  }
  out.push(g);o=ro+len;
 }
 return out;
}
function parseDbf(buf,enc){
 const dv=new DataView(buf),u=new Uint8Array(buf),n=dv.getUint32(4,true),hl=dv.getUint16(8,true),rl=dv.getUint16(10,true),fs=[];
 for(let o=32;o<hl-1&&u[o]!==0x0D;o+=32){let nm='';for(let i=0;i<11&&u[o+i];i++)nm+=String.fromCharCode(u[o+i]);fs.push({nm,t:String.fromCharCode(u[o+11]),len:u[o+16]})}
 if(enc==='auto')enc='utf8';
 const rows=[];
 for(let i=0;i<n;i++){const ro=hl+i*rl;if(ro+rl>u.length)break;let off=1;const r={};
  for(const f of fs){const raw=u.subarray(ro+off,ro+off+f.len);off+=f.len;let v=decodeTxt(raw,enc).replace(/\0/g,'').trim();
   if((f.t==='N'||f.t==='F')&&v!==''&&!isNaN(+v))v=+v;else if(f.t==='D'&&/^\d{8}$/.test(v))v=v.slice(6)+'/'+v.slice(4,6)+'/'+v.slice(0,4);
   r[f.nm]=v}
  rows.push(r)}
 return rows;
}
// --- KML ---
function parseKML(text,files){
 const d=new DOMParser().parseFromString(text,'text/xml'),feats=[],imgs=[];
 const cs=s=>s.trim().split(/\s+/).map(t=>t.split(',').map(Number)).filter(a=>a.length>=2&&!isNaN(a[0])).map(a=>[a[0],a[1]]);
 const geomOf=el=>{const gs=[];
  for(const c of el.children){const n=c.localName;
   if(n==='Point')gs.push({type:'Point',coordinates:cs(c.getElementsByTagName('coordinates')[0]?.textContent||'')[0]});
   else if(n==='LineString')gs.push({type:'LineString',coordinates:cs(c.getElementsByTagName('coordinates')[0]?.textContent||'')});
   else if(n==='Polygon'){const rings=[];const ob=c.getElementsByTagName('outerBoundaryIs')[0];if(ob)rings.push(cs(ob.getElementsByTagName('coordinates')[0].textContent));[...c.getElementsByTagName('innerBoundaryIs')].forEach(ib=>rings.push(cs(ib.getElementsByTagName('coordinates')[0].textContent)));gs.push({type:'Polygon',coordinates:rings})}
   else if(n==='MultiGeometry'){const g=geomOf(c);if(g)gs.push(g)}}
  const ok=gs.filter(g=>g&&g.coordinates!==undefined||g&&g.geometries);
  return ok.length===1?ok[0]:ok.length?{type:'GeometryCollection',geometries:ok}:null};
 for(const pm of d.getElementsByTagName('Placemark')){
  const props={};const nm=pm.getElementsByTagName('name')[0];if(nm)props.ten=nm.textContent.trim();
  for(const sd of pm.getElementsByTagName('SimpleData'))props[sd.getAttribute('name')]=sd.textContent.trim();
  for(const da of pm.getElementsByTagName('Data')){const v=da.getElementsByTagName('value')[0];if(v)props[da.getAttribute('name')]=v.textContent.trim()}
  const ds=pm.getElementsByTagName('description')[0];if(ds&&Object.keys(props).length<=1){const t=ds.textContent.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();if(t)props.mota=t.slice(0,300)}
  const g=geomOf(pm);if(g)feats.push({type:'Feature',properties:props,geometry:g});
 }
 for(const go of d.getElementsByTagName('GroundOverlay')){
  const href=go.getElementsByTagName('href')[0]?.textContent.trim(),bx=go.getElementsByTagName('LatLonBox')[0];if(!href||!bx)continue;
  const v=t=>+bx.getElementsByTagName(t)[0]?.textContent;
  const key=Object.keys(files||{}).find(k=>k===href||k.endsWith('/'+href)||href.endsWith(k));
  if(key)imgs.push({name:go.getElementsByTagName('name')[0]?.textContent||href,blob:new Blob([files[key]],{type:/png$/i.test(key)?'image/png':'image/jpeg'}),bounds:[[v('south'),v('west')],[v('north'),v('east')]]});
 }
 const name=d.getElementsByTagName('Document')[0]?.getElementsByTagName('name')[0]?.textContent;
 return {feats,imgs,name};
}
// --- GPX ---
function parseGPX(text){
 const d=new DOMParser().parseFromString(text,'text/xml'),feats=[];const ll=e=>[+e.getAttribute('lon'),+e.getAttribute('lat')];
 for(const w of d.getElementsByTagName('wpt'))feats.push({type:'Feature',properties:{ten:w.getElementsByTagName('name')[0]?.textContent||''},geometry:{type:'Point',coordinates:ll(w)}});
 for(const t of d.getElementsByTagName('trk')){const segs=[...t.getElementsByTagName('trkseg')].map(s=>[...s.getElementsByTagName('trkpt')].map(ll)).filter(s=>s.length>1);if(segs.length)feats.push({type:'Feature',properties:{ten:t.getElementsByTagName('name')[0]?.textContent||'Vết'},geometry:{type:'MultiLineString',coordinates:segs}})}
 for(const r of d.getElementsByTagName('rte')){const c=[...r.getElementsByTagName('rtept')].map(ll);if(c.length>1)feats.push({type:'Feature',properties:{ten:r.getElementsByTagName('name')[0]?.textContent||'Tuyến'},geometry:{type:'LineString',coordinates:c}})}
 return feats;
}
// --- CSV tọa độ ---
function parseCSV(text){
 const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return {feats:[],sample:null,deg:false};
 const dl=[';','\t',','].sort((a,b)=>lines[0].split(b).length-lines[0].split(a).length)[0];
 const sp=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===dl&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(s=>s.trim())};
 const h=sp(lines[0]).map(s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]/g,''));
 const fi=re=>h.findIndex(x=>re.test(x));
 let la=fi(/^(lat|latitude|vido|vd)$/),lo=fi(/^(lon|lng|long|longitude|kinhdo|kd)$/),deg=la>=0&&lo>=0;
 let xi=fi(/^(x|toadox|xvn2000|vn2000x)$/),yi=fi(/^(y|toadoy|yvn2000|vn2000y)$/);
 const hdr=sp(lines[0]),feats=[];let sample=null;
 for(const l of lines.slice(1)){const c=sp(l),num=i=>parseFloat(String(c[i]).replace(',','.'));let pt;
  if(deg)pt=[num(lo),num(la)];
  else if(xi>=0&&yi>=0){const a=num(xi),b=num(yi);pt=a>b?[b,a]:[a,b]}// [E,N]: số lớn là X (Bắc)
  if(!pt||isNaN(pt[0])||isNaN(pt[1]))continue;sample=sample||pt;
  const props={};hdr.forEach((k,i)=>{if(c[i]!==undefined&&c[i]!=='')props[k]=c[i]});feats.push({type:'Feature',properties:props,geometry:{type:'Point',coordinates:pt}})}
 return {feats,sample,deg};
}
// --- Nạp file ---
$('#mapIn').onchange=async e=>{const fl=[...e.target.files];if(fl.length)await importMapFiles(fl);e.target.value=''};
async function importMapFiles(fileList){
 const o=mapOpts();const F={};
 toast('Đang đọc bản đồ…',10000);
 try{
  for(const f of fileList){const buf=await f.arrayBuffer();const lc=f.name.toLowerCase();
   if(/\.(zip|kmz)$/.test(lc)){const z=await unzip(buf);for(const [k,v] of Object.entries(z))F[(lc.endsWith('.kmz')?f.name.replace(/\.kmz$/i,'')+'/':'')+k]=v}
   else F[f.name]=buf}
  const names=Object.keys(F),low=n=>n.toLowerCase(),base=n=>n.replace(/\.[^.\/]+$/,''),sib=(n,ext)=>names.find(x=>low(x)===low(base(n)+ext));
  const made=[];const txt=b=>decodeTxt(new Uint8Array(b),'utf8');
  for(const n of names){const l=low(n);
   if(l.endsWith('.shp')){
    const geoms=parseShp(F[n]);const dbf=sib(n,'.dbf'),prj=sib(n,'.prj'),cpg=sib(n,'.cpg');
    let rows=[];if(dbf){const enc=o.enc==='auto'?guessEnc(new Uint8Array(F[dbf]),cpg?txt(F[cpg]):''):o.enc;rows=parseDbf(F[dbf],enc)}
    const sample=geoms.map(firstCoord).find(Boolean),crs=pickCrs(prj?txt(F[prj]):'',sample,o),tf=mkTf(crs);
    const feats=geoms.map((g,i)=>g&&{type:'Feature',properties:rows[i]||{},geometry:mapGeom(g,tf)}).filter(Boolean);
    made.push({name:n.split('/').pop().replace(/\.shp$/i,''),feats,crs:crsName(crs),src:'Shapefile'});
   }else if(l.endsWith('.kml')){
    const k=parseKML(txt(F[n]),F);const nm=k.name||n.split('/').pop().replace(/\.kml$/i,'');
    if(k.feats.length)made.push({name:nm,feats:k.feats,crs:'WGS84',src:'KML'});
    k.imgs.forEach(im=>made.push({name:nm+' – '+im.name,kind:'image',image:im.blob,bounds:im.bounds,src:'KMZ ảnh'}));
   }else if(/\.(geojson|json)$/.test(l)){
    const j=JSON.parse(txt(F[n]));
    if(j.app==='tuantra_bvr_map'){for(const ly of j.layers){if(ly.imageData){ly.image=await (await fetch(ly.imageData)).blob();delete ly.imageData}ly.id='M'+uid();ly.created=Date.now();await put('layers',ly);prepLayer(ly);LAYERS.push(ly)}toast('Đã nạp gói bản đồ: '+j.layers.length+' lớp',4000);continue}
    const fc=j.type==='FeatureCollection'?j.features:j.type==='Feature'?[j]:[{type:'Feature',properties:{},geometry:j}];
    const sample=fc.map(f=>firstCoord(f.geometry)).find(Boolean),crs=pickCrs('',sample,o),tf=mkTf(crs);
    made.push({name:n.split('/').pop().replace(/\.(geo)?json$/i,''),feats:fc.filter(f=>f.geometry).map(f=>({type:'Feature',properties:f.properties||{},geometry:mapGeom(f.geometry,tf)})),crs:crsName(crs),src:'GeoJSON'});
   }else if(l.endsWith('.gpx')){
    made.push({name:n.split('/').pop().replace(/\.gpx$/i,''),feats:parseGPX(txt(F[n])),crs:'WGS84',src:'GPX'});
   }else if(l.endsWith('.csv')||l.endsWith('.txt')){
    const enc=o.enc==='auto'?guessEnc(new Uint8Array(F[n])):o.enc;const c=parseCSV(decodeTxt(new Uint8Array(F[n]),enc));
    if(!c.feats.length)continue;const crs=c.deg?{type:'wgs'}:pickCrs('',c.sample,o),tf=mkTf(crs);
    made.push({name:n.split('/').pop().replace(/\.\w+$/,''),feats:c.feats.map(f=>({...f,geometry:mapGeom(f.geometry,tf)})),crs:crsName(crs),src:'CSV'});
   }else if(/\.(jpe?g|png)$/.test(l)){
    const wf=sib(n,l.endsWith('png')?'.pgw':'.jgw')||sib(n,'.wld')||sib(n,'.jpgw')||sib(n,'.pngw');if(!wf)continue;
    const w=txt(F[wf]).trim().split(/\s+/).map(Number);const blob=new Blob([F[n]],{type:l.endsWith('png')?'image/png':'image/jpeg'});
    const bm=await createImageBitmap(blob);const Wp=bm.width,Hp=bm.height;bm.close&&bm.close();
    const prj=sib(n,'.prj'),x0=w[4],y0=w[5],x1=w[4]+w[0]*Wp,y1=w[5]+w[3]*Hp;
    const crs=pickCrs(prj?txt(F[prj]):'',[x0,y0],o),tf=mkTf(crs);
    const c1=tf([x0,y0]),c2=tf([x1,y1]),c3=tf([x0,y1]),c4=tf([x1,y0]);
    const la=[c1,c2,c3,c4].map(c=>c[1]),lo=[c1,c2,c3,c4].map(c=>c[0]);
    made.push({name:n.split('/').pop(),kind:'image',image:blob,bounds:[[Math.min(...la),Math.min(...lo)],[Math.max(...la),Math.max(...lo)]],crs:crsName(crs),src:'Ảnh + world file'});
   }
  }
  let nf=0;
  for(const m of made){
   const ly={id:'M'+uid(),name:m.name,kind:m.kind||'vector',src:m.src,crs:m.crs||'',color:PALETTE[(LAYERS.length)%PALETTE.length],visible:true,created:Date.now()};
   if(ly.kind==='image'){ly.image=m.image;ly.bounds=m.bounds;ly.opacity=0.75}else{if(!m.feats.length)continue;ly.geojson={type:'FeatureCollection',features:m.feats};ly.count=m.feats.length;nf+=m.feats.length}
   await put('layers',ly);prepLayer(ly);LAYERS.push(ly);
  }
  if(!made.length&&!names.some(n=>/\.json$/i.test(n)))toast('Không tìm thấy dữ liệu bản đồ trong file. Shapefile cần chọn đủ .shp + .dbf (+ .prj) hoặc nén thành .zip',6000);
  else if(made.length)toast(`Đã nạp ${made.length} lớp (${nf} đối tượng)`,4000);
 }catch(err){console.error(err);toast('Lỗi đọc bản đồ: '+err.message,6000)}
 if(curTab==='map')renderMapTab();
}
// --- Chuẩn bị lớp: bbox từng đối tượng để tra "đang ở lô nào" ---
function bboxOf(g,b=[180,90,-180,-90]){if(!g)return b;if(g.type==='GeometryCollection'){g.geometries.forEach(x=>bboxOf(x,b));return b}
 const walk=c=>{if(typeof c[0]==='number'){if(c[0]<b[0])b[0]=c[0];if(c[1]<b[1])b[1]=c[1];if(c[0]>b[2])b[2]=c[0];if(c[1]>b[3])b[3]=c[1]}else c.forEach(walk)};walk(g.coordinates);return b}
function prepLayer(ly){
 if(ly.kind==='image'){ly._bb=[ly.bounds[0][1],ly.bounds[0][0],ly.bounds[1][1],ly.bounds[1][0]];return}
 ly._bb=[180,90,-180,-90];ly._poly=[];
 ly.geojson.features.forEach(f=>{const b=bboxOf(f.geometry);f._bb=b;bboxOf(f.geometry,ly._bb);const t=f.geometry?.type;if(t==='Polygon'||t==='MultiPolygon')ly._poly.push(f)});
}
function pip(pt,g){
 const inR=r=>{let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){if(((r[i][1]>pt[1])!==(r[j][1]>pt[1]))&&(pt[0]<(r[j][0]-r[i][0])*(pt[1]-r[i][1])/(r[j][1]-r[i][1])+r[i][0]))c=!c}return c};
 const inP=p=>inR(p[0])&&!p.slice(1).some(inR);
 return g.type==='Polygon'?inP(g.coordinates):g.coordinates.some(inP);
}
function placeLabel(p){
 const g=re=>{for(const k in p){if(re.test(k.replace(/[\s_]/g,''))&&p[k]!==''&&p[k]!=null)return p[k]}};
 const tk=g(/^(tk|tieukhu|matk|sotk|tieuk)$/i),kh=g(/^(kh|khoanh|makhoanh|makh|sokhoanh)$/i),lo=g(/^(lo|malo|lorung|solo|tenlo)$/i);
 const tt=g(/^(ldlr|maldlr|trangthai|hientrang|ldlrmoi)$/i),cr=g(/^(churung|tenchu|ctrung|tenchurung|chuho)$/i),dt=g(/^(dtich|dientich|dt|area)$/i),ten=g(/^(ten|name|tenlop|ghichu)$/i);
 const parts=[];if(tk!=null)parts.push('TK '+tk);if(kh!=null)parts.push('K '+kh);if(lo!=null)parts.push('lô '+lo);
 let s=parts.join(', ');if(tt)s+=(s?' – ':'')+tt;if(dt!=null&&parts.length)s+=' ('+String(dt).replace('.',',')+' ha)';if(cr)s+=(s?' – ':'')+'Chủ rừng: '+cr;
 return s||(ten!=null?String(ten):'');
}
function whereAmI(lat,lng){
 const pt=[lng,lat],hits=[];
 for(const ly of LAYERS){if(ly.kind!=='vector'||!ly._poly||!ly._poly.length)continue;const b=ly._bb;if(lng<b[0]||lng>b[2]||lat<b[1]||lat>b[3])continue;
  for(const f of ly._poly){const fb=f._bb;if(lng<fb[0]||lng>fb[2]||lat<fb[1]||lat>fb[3])continue;if(pip(pt,f.geometry)){const l=placeLabel(f.properties||{});if(l)hits.push({ly,f,label:l});break}}}
 if(!hits.length)return null;
 hits.sort((a,b)=>(/TK|K |lô/.test(b.label)?1:0)-(/TK|K |lô/.test(a.label)?1:0));
 return {label:hits[0].label,layer:hits[0].ly.name,all:hits};
}

function leafLayer(ly,quiet){
 if(ly.kind==='image'){if(!ly._url)ly._url=URL.createObjectURL(ly.image);return L.imageOverlay(ly._url,ly.bounds,{opacity:ly.opacity??0.75})}
 return L.geoJSON(ly.geojson,{interactive:!quiet,style:()=>({color:ly.color,weight:1.6,fillColor:ly.color,fillOpacity:0.07}),
  pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:'#000',weight:1,fillColor:ly.color,fillOpacity:.9}),
  onEachFeature:quiet?null:(f,l)=>{const p=f.properties||{},ks=Object.keys(p).filter(k=>!k.startsWith('_')).slice(0,18);const lb=placeLabel(p);
   l.bindPopup('<b>'+esc(lb||ly.name)+'</b><div style="font-size:11px;color:#777">'+esc(ly.name)+'</div><table>'+ks.map(k=>'<tr><td>'+esc(k)+'</td><td>'+esc(p[k])+'</td></tr>').join('')+'</table>',{maxHeight:260})}});
}

  MM.fitBounds([[Math.min(...b.map(x=>x[1])),Math.min(...b.map(x=>x[0]))],[Math.max(...b.map(x=>x[3])),Math.max(...b.map(x=>x[2]))]],{padding:[20,20],maxZoom:17})};

 if(MM&&window.L){const ll=[fix.lat,fix.lng];
  if(!mePt){meAcc=L.circle(ll,{radius:fix.acc,color:'#1e90ff',weight:1,fillOpacity:.12}).addTo(MM);mePt=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#1e90ff',fillOpacity:1}).addTo(MM)}

function svgMap(W,H){
 const vis=LAYERS.filter(l=>l.visible&&l.kind==='vector');const bbs=vis.map(l=>l._bb);if(fix)bbs.push([fix.lng-0.003,fix.lat-0.003,fix.lng+0.003,fix.lat+0.003]);
 if(!bbs.length)return '<div class="mu" style="padding:16px">Không có mạng và chưa có lớp bản đồ để hiển thị.</div>';
 let c=Math.min(...bbs.map(b=>b[0])),a=Math.min(...bbs.map(b=>b[1])),d=Math.max(...bbs.map(b=>b[2])),b=Math.max(...bbs.map(b=>b[3]));
 if(fix&&vis.length){const z=0.01;c=Math.max(c,fix.lng-z);d=Math.min(d,fix.lng+z);a=Math.max(a,fix.lat-z);b=Math.min(b,fix.lat+z)}
 const kx=Math.cos((a+b)/2*RAD),sx=(d-c)*kx||1e-4,sy=(b-a)||1e-4,sc=Math.min((W-20)/sx,(H-20)/sy);
 const X=v=>(10+(v-c)*kx*sc+((W-20)-sx*sc)/2).toFixed(1),Y=v=>(H-10-(v-a)*sc-((H-20)-sy*sc)/2).toFixed(1);
 const path=r=>'M'+r.map(p=>X(p[0])+','+Y(p[1])).join('L');let s='';
 for(const l of vis)for(const f of l.geojson.features){const fb=f._bb;if(fb&&(fb[2]<c||fb[0]>d||fb[3]<a||fb[1]>b))continue;const g=f.geometry;if(!g)continue;
  if(g.type==='Polygon')s+=`<path d="${g.coordinates.map(path).join('Z')}Z" fill="${l.color}" fill-opacity=".08" stroke="${l.color}" stroke-width="1.2"/>`;
  else if(g.type==='MultiPolygon')s+=`<path d="${g.coordinates.map(p=>p.map(path).join('Z')+'Z').join('')}" fill="${l.color}" fill-opacity=".08" stroke="${l.color}" stroke-width="1.2"/>`;
  else if(g.type==='LineString')s+=`<path d="${path(g.coordinates)}" fill="none" stroke="${l.color}" stroke-width="2"/>`;
  else if(g.type==='MultiLineString')s+=`<path d="${g.coordinates.map(path).join('')}" fill="none" stroke="${l.color}" stroke-width="2"/>`;
  else if(g.type==='Point')s+=`<circle cx="${X(g.coordinates[0])}" cy="${Y(g.coordinates[1])}" r="4" fill="${l.color}" stroke="#000"/>`;}
 if(active)active.track.forEach(t=>{if(t.length>1)s+=`<polyline fill="none" stroke="#ff3b30" stroke-width="3" points="${t.map(p=>X(p[1])+','+Y(p[0])).join(' ')}"/>`});
 if(fix)s+=`<circle cx="${X(fix.lng)}" cy="${Y(fix.lat)}" r="8" fill="#1e90ff" stroke="#fff" stroke-width="3"/>`;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" style="background:#26332a">${s}</svg>`;
}
